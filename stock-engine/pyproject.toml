[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-engine"
version = "0.1.0"
description = "NIFTY 50 Source Credibility & Temporal Asymmetry Signal Engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14.0",
    "yfinance>=0.2.31",
    "google-cloud-bigquery>=3.10",
    "db-dtypes>=1.1",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "joblib>=1.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
app = [
    "streamlit>=1.28",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.18",
]
research = [
    "jupyterlab>=4.0",
    "jupytext>=1.15",
]

[tool.setuptools.packages.find]
include = ["config*", "pipeline*", "models*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
