name: Stock Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
        pip install -e .

    - name: Check for Circular Leakage (AST Guard)
      run: |
        python pipeline/check_circularity.py

    - name: Check for Placeholder/Simulated Content in outputs/tables
      run: |
        python pipeline/check_outputs.py

    - name: Regenerate RESULTS.md from outputs/tables
      run: |
        python pipeline/gen_results_md.py

    - name: Verify RESULTS.md matches committed version
      run: |
        if ! git diff --quiet RESULTS.md; then
          echo "ERROR: RESULTS.md differs from committed version."
          echo "Run 'python pipeline/gen_results_md.py' locally and commit the changes."
          git diff RESULTS.md
          exit 1
        fi

    - name: Run Test Suite
      run: |
        pytest tests/ -v --junitxml=pytest-report.xml
